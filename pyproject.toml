[project]
name = "sonic-sampler"
description = "Unified Tile-Aware Kernels for LLM Sampling and Speculative Verification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "triton>=3.5.1",
    "torch",
    "msgspec>=0.22.0",
    "cytoolz",
    "tomli_w",
    "tyro>=1.0",
]

[project.optional-dependencies]
bench = ["rich", "loguru", "nvidia-ml-py"]

[project.scripts]
sonic-sampler = "sonic_sampler.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sonic_sampler.__version__" }

[tool.setuptools.package-data]
sonic_sampler = ["resources/dispatch/*.toml", "resources/benchmark/*.toml"]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

